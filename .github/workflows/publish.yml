name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.23.6
      ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
      ZOLA_IMAGE: ghcr.io/getzola/zola@sha256:722c7af3c6a7c0ccc37f01d85d47ee3e8b53ea6399f2b7dd7f9b82af7624fd61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Zola
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zola
          key: zola-${{ env.ZOLA_VERSION }}-${{ env.ZOLA_SHA256 }}

      - name: Install Zola
        id: install
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if ! curl -sSfL --retry 5 --retry-all-errors -o zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz

      - name: Build
        env:
          USE_DOCKER: ${{ steps.install.outputs.docker }}
        run: |
          if [ "$USE_DOCKER" = "true" ]; then
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/app -w /app "$ZOLA_IMAGE" build
          else
            ./zola build
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
